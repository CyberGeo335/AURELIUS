services:
  db:
    build:
      context: .
      dockerfile: deploy/Postgres.Dockerfile
    environment:
      POSTGRES_DB: aurelius_v2
      POSTGRES_USER: aurelius
      POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:-aurelius_v2_local_demo_only}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - v2_data:/var/lib/postgresql/data
      - ./scoring/bd/business_scoring.backup:/seed/business_scoring.backup:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  init:
    build:
      context: .
      dockerfile: Dockerfile.v2
    command: ["python","-m","personalCab.prom_v2.web_server","--init","--seed-demo"]
    environment: &v2env
      PG_HOST: db
      PG_PORT: 5432
      PG_DATABASE: aurelius_v2
      PG_USER: aurelius
      PG_PASSWORD: ${V2_POSTGRES_PASSWORD:-aurelius_v2_local_demo_only}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      V2_PUBLIC_ORIGIN: http://127.0.0.1:${V2_PORT:-5180}
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: Dockerfile.v2
    environment: *v2env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${V2_PORT:-5180}:5180"
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  v2_data:
